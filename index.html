<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUIT Smart Shuttle</title>
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --accent: #34a853;
    --danger: #ea4335;
    --warn: #fbbc04;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #202124;
    --text-light: #5f6368;
    --border: #dadce0;
    --radius: 10px;
    --shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app-header {
    background: linear-gradient(135deg, var(--primary), #0d47a1);
    color: #fff;
    width: 100%;
    padding: 18px 24px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  .app-header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .5px; }
  .app-header p { font-size: .85rem; opacity: .85; margin-top: 2px; }
  .container {
    width: 100%;
    max-width: 520px;
    padding: 24px 16px;
    flex: 1;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1.15rem;
    margin-bottom: 18px;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .icon { font-size: 1.3rem; }
  .welcome-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 10px 14px;
    background: #e8f0fe;
    border-radius: 8px;
    font-size: .85rem;
  }
  .welcome-bar strong { color: var(--primary-dark); }
  label {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    color: var(--text-light);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: .95rem;
    transition: border-color .2s;
    background: #fafafa;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,115,232,.15);
  }
  textarea { resize: vertical; min-height: 96px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    width: 100%;
    margin-top: 16px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--accent); color: #fff; }
  .btn-success:hover { background: #2d9249; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #d32f2f; }
  .btn-outline {
    background: transparent;
    color: var(--primary);
    border: 1.5px solid var(--primary);
  }
  .btn-outline:hover { background: #e8f0fe; }
  .btn-sm { padding: 7px 14px; font-size: .8rem; width: auto; margin-top: 8px; }
  .btn-group { display: flex; gap: 8px; margin-top: 16px; }
  .btn-group .btn { flex: 1; }
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .menu-btn {
    padding: 18px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    cursor: pointer;
    text-align: center;
    transition: all .2s;
    font-size: .85rem;
    font-weight: 600;
    color: var(--text);
  }
  .menu-btn:hover {
    border-color: var(--primary);
    background: #e8f0fe;
    color: var(--primary);
  }
  .menu-btn .menu-icon { font-size: 1.6rem; display: block; margin-bottom: 6px; }
  .menu-btn.danger-zone { border-color: var(--danger); color: var(--danger); }
  .menu-btn.danger-zone:hover { background: #fce8e6; }
  .alert {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: .85rem;
    margin-bottom: 12px;
  }
  .alert-success { background: #e6f4ea; color: #137333; }
  .alert-error { background: #fce8e6; color: #c5221f; }
  .alert-info { background: #e8f0fe; color: #1967d2; }
  .alert-warn { background: #fef7e0; color: #b06000; }
  .list-item {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: .85rem;
    transition: all .2s;
  }
  .list-item:hover { border-color: var(--primary); }
  .list-item .label { color: var(--text-light); font-size: .75rem; }
  .list-item .value { font-weight: 600; margin-top: 2px; }
  .list-item .row { display: flex; justify-content: space-between; align-items: center; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-pending { background: #fef7e0; color: #b06000; }
  .badge-approved { background: #e6f4ea; color: #137333; }
  .badge-rejected { background: #fce8e6; color: #c5221f; }
  .badge-completed { background: #e0e0e0; color: #3c4043; }
  .badge-full { background: var(--danger); color: #fff; }
  .badge-warn { background: var(--warn); color: #333; }
  .tt-chip {
    display: inline-block;
    padding: 6px 10px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: .8rem;
    font-weight: 600;
    background: #fafafa;
    white-space: nowrap;
  }
  .tt-chip.full { border-color: var(--danger); color: var(--danger); }
  .tt-chip.next { border-color: var(--accent); background: #e6f4ea; color: #137333; }
  .capacity-bar {
    height: 8px;
    background: #e0e0e0;
    border-radius: 4px;
    overflow: hidden;
    margin: 6px 0;
  }
  .capacity-fill {
    height: 100%;
    border-radius: 4px;
    transition: width .3s;
  }
  .hidden { display: none !important; }
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }
  .text-center { text-align: center; }
  .text-muted { color: var(--text-light); font-size: .8rem; }
  .password-wrap {
    position: relative;
  }
  .password-wrap input { padding-right: 40px; }
  .password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--text-light);
  }
  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    color: var(--primary);
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
  .forgot-link {
    display: block;
    text-align: center;
    margin: 10px 0 0;
    color: var(--primary);
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .forgot-link:hover { text-decoration: underline; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .82rem;
    margin-top: 10px;
  }
  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--text-light); font-weight: 600; font-size: .75rem; text-transform: uppercase; }
  .empty-state {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-light);
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }
  .footer {
    text-align: center;
    padding: 16px;
    font-size: .75rem;
    color: var(--text-light);
  }
</style>
</head>
<body>

<div class="app-header">
  <h1>🚌 JUIT Smart Shuttle</h1>
  <p>Shuttle Request & Management System</p>
</div>

<div class="container" id="app"></div>
<div class="footer">JUIT Smart Shuttle &copy; 2026</div>

<script>
// ============================================================
// API CLIENT
// On Vercel: API is served from the same origin (relative paths).
// Locally: API runs on shuttle_api at 127.0.0.1:8080.
// ============================================================
const API = window.location.port === '8080'
  ? 'http://127.0.0.1:8080'           // running against local C server
  : window.location.origin;            // deployed (Vercel or same-origin)

// Wraps fetch with timeout + JSON handling; throws Error(message) on
// non-2xx using the API's {"error":"..."} body.
async function apiCall(method, path, body, auth = false) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    const res = await fetch(API + path, {
      method,
      headers: {
        'Content-Type': 'application/json',
        ...(auth && window.API_TOKEN ? { 'Authorization': 'Bearer ' + window.API_TOKEN } : {})
      },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: ctrl.signal
    });
    const text = await res.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch { data = {}; }
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Server took too long to respond. The first request after a quiet period can be slow — please try again.');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

const LOCATIONS = ['JUIT', 'Ravli PG', 'Peach Tree', 'Waknaghat'];
const locName = (i) => LOCATIONS[i] || 'Unknown';
const locIndex = (s) => LOCATIONS.indexOf(s);
const routeName = (p, d) => `${p} → ${d}`;
const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// 24h "HH:MM" (or a full time string) -> friendly 12h "7:45 AM".
function to12h(t) {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(t));
  if (!m) return String(t);
  let h = parseInt(m[1], 10);
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${m[2]} ${ap}`;
}

// Does a schedule entry run on the given weekday (0=Sunday)? The schema has
// no day-of-week column, so service days are parsed from the label
// ('Mon-Sat', 'Sunday van', etc.); unlabeled rows are treated as daily.
function runsOnDay(label, day) {
  const l = String(label || '').toLowerCase();
  if (/\bsun(day)?\b/.test(l)) return day === 0;                    // Sunday-only (vans)
  if (/\bmon\s*[-–]\s*(sat|saturday)\b/.test(l)) return day >= 1 && day <= 6;
  if (/\bmon\s*[-–]\s*(fri|friday)\b/.test(l)) return day >= 1 && day <= 5;
  return true; // daily or unlabeled
}

// Next upcoming departure across the whole week — Mon-Sat fixed buses plus
// Sunday vans. Evaluated in the viewer's local time.
// rows: [{departure_time:'HH:MM', label, ...}]. Returns the row plus daysAhead
// (0 = today) or null when nothing is scheduled within a week.
function nextDeparture(rows, from) {
  for (let daysAhead = 0; daysAhead <= 7; daysAhead++) {
    const d = new Date(from);
    d.setDate(d.getDate() + daysAhead);
    const minsNow = d.getHours() * 60 + d.getMinutes();
    const candidates = rows
      .map(s => ({ s, m: /^(\d{1,2}):(\d{2})/.exec(s.departure_time) }))
      .filter(x => x.m && runsOnDay(x.s.label, d.getDay()))
      .map(x => ({ s: x.s, hm: parseInt(x.m[1], 10) * 60 + parseInt(x.m[2], 10) }))
      .filter(x => daysAhead > 0 || x.hm > minsNow)
      .sort((a, b) => a.hm - b.hm);
    if (candidates.length) {
      return { ...candidates[0].s, daysAhead, weekday: WEEKDAY_NAMES[d.getDay()] };
    }
  }
  return null;
}

// Session survives reload via localStorage (token only — server holds the state).
let session = JSON.parse(localStorage.getItem('jss_session') || 'null');
function saveSession() { localStorage.setItem('jss_session', JSON.stringify(session)); window.API_TOKEN = session ? session.token : null; }
function clearSession() { localStorage.removeItem('jss_session'); session = null; window.API_TOKEN = null; }
window.API_TOKEN = session ? session.token : null;

const badge = (status) => {
  const cls = status === 'APPROVED' ? 'approved' : status === 'REJECTED' ? 'rejected' : status === 'COMPLETED' ? 'completed' : 'pending';
  return `<span class="badge badge-${cls}">${status.replace('_',' ')}</span>`;
};

// ============================================================
// RENDERING
// ============================================================
const $app = document.getElementById('app');

function render(html) {
  // Any screen change tears down the public timetable's live refresh; the
  // public view re-arms it after its final render. This guarantees no stray
  // poller can survive a navigation (login, portal switch, etc.).
  stopPublicTimetableRefresh();
  $app.innerHTML = html;
}

// ---------- LOGIN PAGE ----------
function showLogin() {
  render(`
    <div class="card">
      <h2><span class="icon">🔐</span> Login</h2>
      <div id="alert"></div>
      <label>Role</label>
      <select id="role">
        <option value="student">Student</option>
        <option value="guard">Guard</option>
        <option value="scheduler">Bus Scheduler</option>
        <option value="admin">Admin</option>
      </select>
      <div id="rollField">
        <label>Roll Number</label>
        <input type="number" id="roll" placeholder="Enter roll number">
      </div>
      <div class="password-wrap">
        <label>Password</label>
        <input type="password" id="pass" placeholder="Enter password">
        <button class="password-toggle" onclick="togglePass()">👁</button>
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Login</button>
      <hr class="divider">
      <button class="btn btn-outline" onclick="showRegister()">📝 Register New Student</button>
      <a class="forgot-link" onclick="showPublicTimetable()">🕒 Bus &amp; Van Timetable — no login needed</a>
    </div>
  `);
  document.getElementById('role').addEventListener('change', e => {
    document.getElementById('rollField').classList.toggle('hidden', e.target.value !== 'student');
  });
}

function togglePass() {
  const p = document.getElementById('pass');
  p.type = p.type === 'password' ? 'text' : 'password';
}

async function doLogin() {
  const role = document.getElementById('role').value;
  const pass = document.getElementById('pass').value;
  if (!pass) return showAlert('alert', 'Please enter a password.', 'error');

  const payload = { role, password: pass };
  if (role === 'student') {
    const roll = parseInt(document.getElementById('roll').value);
    if (!roll) return showAlert('alert', 'Please enter your roll number.', 'error');
    payload.roll_number = roll;
  }

  try {
    const data = await apiCall('POST', '/api/login', payload);
    session = data.role === 'student'
      ? { role: 'student', token: data.token, roll: data.roll_number, name: data.name, must_change: !!data.must_change_password }
      : { role: data.role, token: data.token };
    saveSession();
    if (session.role === 'student' && data.must_change_password) return showForceChangePassword();
    if (session.role === 'student') showStudentPortal();
    else if (session.role === 'guard') showGuardPortal();
    else if (session.role === 'admin') showAdminPortal();
    else showBusSchedulerPortal();
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

function showAlert(id, msg, type) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

// ---------- FIRST-LOGIN PASSWORD CHANGE (forced, one-time) ----------
// Passwords are admin-managed: students change their own password only here,
// once, after the admin issues them a default. No self-service reset exists.
function showForceChangePassword() {
  render(`
    <div class="welcome-bar"><span>🔐 <strong>Set your password</strong></span></div>
    <div class="card">
      <h2><span class="icon">🔐</span>Change Your Password</h2>
      <p style="margin:4px 0 8px">Your account was created by the admin with a default password. Choose a new password to continue — you won't be asked again. If you ever forget it, ask the admin to reset it.</p>
      <div id="alert"></div>
      <div class="password-wrap">
        <label>New Password</label>
        <input type="password" id="fc_pass" placeholder="Min 8 characters">
        <button class="password-toggle" onclick="toggleFcPass()">👁</button>
      </div>
      <label>Confirm New Password</label>
      <input type="password" id="fc_pass2" placeholder="Repeat new password">
      <button class="btn btn-primary" onclick="doForceChangePassword()">Save &amp; Continue</button>
      <hr class="divider">
      <button class="btn btn-outline btn-sm" onclick="doLogout()" style="width:100%">🚪 Logout</button>
    </div>
  `);
}

function toggleFcPass() {
  const p = document.getElementById('fc_pass');
  p.type = p.type === 'password' ? 'text' : 'password';
}

async function doForceChangePassword() {
  const pass = document.getElementById('fc_pass').value;
  const pass2 = document.getElementById('fc_pass2').value;
  if (pass.length < 8) return showAlert('alert', 'Password must be at least 8 characters.', 'error');
  if (pass !== pass2) return showAlert('alert', 'Passwords do not match.', 'error');
  try {
    await apiCall('PUT', '/api/students/password', { new_password: pass }, true);
    session.must_change = false;
    saveSession();
    showAlert('alert', 'Password saved! Welcome aboard. 🚌', 'success');
    setTimeout(showStudentPortal, 1200);
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

// ---------- REGISTER ----------
function showRegister() {
  render(`
    <a class="back-link" onclick="showLogin()">← Back to Login</a>
    <div class="card">
      <h2><span class="icon">📝</span> Student Registration</h2>
      <div id="alert"></div>
      <label>Roll Number</label>
      <input type="number" id="reg_roll" placeholder="e.g. 261030195">
      <label>Name</label>
      <input type="text" id="reg_name" placeholder="Full name">
      <label>Room Number</label>
      <input type="text" id="reg_room" placeholder="e.g. 26">
      <label>Hostel</label>
      <select id="reg_hostel">
        <option>Peach Tree</option>
        <option>Ravli PG</option>
        <option>Geeta Bhavan</option>
        <option>Waknaghat</option>
      </select>
      <label>Phone Number</label>
      <input type="tel" id="reg_phone" placeholder="10-digit number">
      <div class="password-wrap">
        <label>Create Password</label>
        <input type="password" id="reg_pass" placeholder="Min 4 characters">
      </div>
      <button class="btn btn-success" onclick="doRegister()">Register</button>
    </div>
  `);
}

async function doRegister() {
  const roll = parseInt(document.getElementById('reg_roll').value);
  const name = document.getElementById('reg_name').value.trim();
  const room = document.getElementById('reg_room').value.trim();
  const hostel = document.getElementById('reg_hostel').value;
  const phone = document.getElementById('reg_phone').value.trim();
  const pass = document.getElementById('reg_pass').value;

  if (!roll || !name || !room || !phone || !pass)
    return showAlert('alert', 'All fields are required.', 'error');
  if (pass.length < 4)
    return showAlert('alert', 'Password must be at least 4 characters.', 'error');

  try {
    await apiCall('POST', '/api/register', {
      roll_number: roll, name, room, hostel, phone, password: pass
    });
    showAlert('alert', 'Registration successful! You can now login.', 'success');
    setTimeout(showLogin, 1500);
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

// ---------- STUDENT PORTAL ----------
function showStudentPortal() {
  render(`
    <div class="welcome-bar">
      <span>Welcome, <strong>${session.name}</strong></span>
      <span class="text-muted">Roll: ${session.roll}</span>
    </div>
    <div class="card">
      <h2><span class="icon">🎓</span> Student Portal</h2>
      <div class="menu-grid">
        <div class="menu-btn" onclick="showCreateRequest()"><span class="menu-icon">🚗</span>Create Pickup Request</div>
        <div class="menu-btn" onclick="showStudentStatus()"><span class="menu-icon">📋</span>Check Request Status</div>
        <div class="menu-btn" onclick="showTimetable('showStudentPortal')"><span class="menu-icon">🕒</span>Bus Timetable</div>
      </div>
      <hr class="divider">
      <button class="btn btn-outline btn-sm" onclick="doLogout()" style="width:100%">🚪 Logout</button>
    </div>
  `);
}

function showCreateRequest() {
  render(`
    <a class="back-link" onclick="showStudentPortal()">← Back</a>
    <div class="card">
      <h2><span class="icon">🚗</span> Create Pickup Request</h2>
      <div id="alert"></div>
      <label>Pickup Location</label>
      <select id="req_pickup">
        ${LOCATIONS.map((l,i) => `<option value="${i}">${l}</option>`).join('')}
      </select>
      <label>Dropoff Location</label>
      <select id="req_dropoff">
        ${LOCATIONS.map((l,i) => `<option value="${i}" ${i===1?'selected':''}>${l}</option>`).join('')}
      </select>
      <label>Required Transport Time <span class="text-muted">(optional · book ≥ 30 min ahead)</span></label>
      <input type="datetime-local" id="req_time">
      <button class="btn btn-primary" onclick="submitRequest()">Submit Request</button>
    </div>
  `);
}

async function submitRequest() {
  const pickup = locName(parseInt(document.getElementById('req_pickup').value));
  const dropoff = locName(parseInt(document.getElementById('req_dropoff').value));
  if (pickup === dropoff) return showAlert('alert', 'Pickup and dropoff must be different.', 'error');

  const timeVal = document.getElementById('req_time').value;
  const required_time = timeVal ? new Date(timeVal).toISOString() : undefined;

  try {
    const data = await apiCall('POST', '/api/requests', { pickup_place: pickup, dropoff_place: dropoff, required_time }, true);
    showAlert('alert', `Request #${data.request_number} submitted successfully!`, 'success');
    setTimeout(showStudentPortal, 1200);
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

async function showStudentStatus() {
  render(`<a class="back-link" onclick="showStudentPortal()">← Back</a><div class="card"><h2><span class="icon">📋</span> My Requests</h2><div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div></div>`);
  let rows;
  try {
    rows = (await apiCall('GET', '/api/requests/mine', undefined, true)).requests;
  } catch (e) {

// ---------- TIMETABLE (all roles) ----------
function backLink(fn) { return `<a class="back-link" onclick="${fn}()">← Back</a>`; }

// Shared timetable body: "next departure" banner + departures grouped by
// route and vehicle type (buses first, then vans). Used by both the
// logged-in timetable and the public login-screen view.
// opts.emptyMsg: shown when rows is empty.
// opts.nextRows: rows scanned for the next departure — defaults to rows;
// override when rows only covers part of the week (e.g. today only) so the
// banner can still point at tomorrow's first ride.
function timetableBody(rows, opts = {}) {
  const { emptyMsg = 'No departures scheduled.', nextRows = rows, now = new Date() } = opts;
  // Banner is computed against nextRows so it still points ahead when rows
  // only covers today ("no more departures today → next one is Monday 7:45").
  const nextBanner = () => {
    const next = nextDeparture(nextRows, now);
    if (!next) return `<div class="alert alert-warn">No departures in the next 7 days.</div>`;
    const when = next.daysAhead === 0 ? `today at ${to12h(next.departure_time)}` : `on ${next.weekday} at ${to12h(next.departure_time)}`;
    const veh = (next.vehicle_type === 'van' || /van/i.test(next.label || '')) ? 'Van' : 'Bus';
    return `<div class="alert alert-info">⏭️ Next departure: <strong>${when}</strong> — ${veh} #${next.bus_number} · ${next.route}</div>`;
  };
  if (!rows.length) {
    return nextBanner() + `<div class="empty-state"><div class="icon">🕒</div><p>${emptyMsg}</p></div>`;
  }
  let html = nextBanner();

  // Group departures by route AND vehicle type so Sunday vans appear as
  // their own line, separate from the Mon-Sat buses on the same route.
  const groups = new Map();
  rows.forEach(s => {
    const isVan = s.vehicle_type === 'van' || /van/i.test(s.label || '');
    const key = s.route + (isVan ? '::van' : '::bus');
    if (!groups.has(key)) groups.set(key, { route: s.route, isVan, departures: [] });
    groups.get(key).departures.push(s);
  });

  // Buses first, then vans, each group ordered by time.
  [...groups.values()]
    .sort((a, b) => (a.isVan - b.isVan) || a.route.localeCompare(b.route))
    .forEach(g => {
      g.departures.sort((a, b) => a.departure_time.localeCompare(b.departure_time));
      const icon = g.isVan ? '🚐' : '🚌';
      const veh = g.isVan ? 'Van' : 'Bus';
      const label0 = g.departures[0].label || '';
      const days = g.isVan ? 'Sunday' : (label0.includes('·') ? label0.split('·').pop().trim() : (label0 || 'Daily'));
      html += `
      <div class="list-item">
        <div class="row">
          <span style="font-weight:700;font-size:1.05rem">${icon} ${g.route}</span>
          <span class="text-muted">${days}</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">`;
      g.departures.forEach(s => {
        const full = s.seats_available <= 0;
        const seats = full ? 'FULL' : `${s.seats_available} left`;
        html += `<span class="tt-chip${full ? ' full' : ''}" title="${veh} #${s.bus_number} — ${seats}">🕒 ${to12h(s.departure_time)}<span class="text-muted" style="margin-left:6px">${icon}#${s.bus_number} · ${seats}</span></span>`;
      });
      html += `</div></div>`;
    });
  return html;
}

// ---------- PUBLIC TIMETABLE LIVE REFRESH ----------
// Polls the public endpoint every 60s and repaints ONLY the timetable body,
// so the hostel-gate screen stays flicker-free and keeps its scroll position.
// A generation counter discards in-flight fetches if the user navigates away
// (render() stops the poller, so no stray timer ever survives a screen change).
const PUBLIC_TT_REFRESH_MS = 60000;
let publicTTTimer = null;
let publicTTMode = null;      // 'today' | 'week' (null behaves as today)
let publicTTData = null;      // latest fetched schedule rows
let publicTTGen = 0;          // bumped on every stop; stale fetches bail out
let publicTTVisibilityHooked = false;

function stopPublicTimetableRefresh() {
  if (publicTTTimer) { clearInterval(publicTTTimer); publicTTTimer = null; }
  // Bump the generation so any in-flight refresh writes nothing. Last fetched
  // data is deliberately KEPT: showPublicTimetable sets it right before its
  // final render(), and a fresh view always overwrites it before painting.
  publicTTGen++;
}

function paintPublicTimetableBody() {
  const host = document.getElementById('public-tt-body');
  if (!host) return;
  const now = new Date();
  const rows = publicTTData || [];
  const bodyRows = publicTTMode === 'week' ? rows : rows.filter(s => runsOnDay(s.label, now.getDay()));
  const emptyMsg = publicTTMode === 'week'
    ? 'No departures scheduled yet.'
    : 'No more departures today — check the full week.';
  const dayHeader = document.getElementById('public-tt-day');
  if (dayHeader) dayHeader.textContent = `📅 ${WEEKDAY_NAMES[now.getDay()]} · times shown for your device's timezone`;
  host.innerHTML = timetableBody(bodyRows, { emptyMsg, nextRows: rows, now });
}

async function refreshPublicTimetable() {
  const gen = publicTTGen;
  try {
    const data = await apiCall('GET', '/api/timetable/public');
    if (gen !== publicTTGen) return;              // screen changed mid-flight
    publicTTData = data.schedule || [];
    if (document.getElementById('public-tt-body')) paintPublicTimetableBody();
  } catch {
    if (gen !== publicTTGen) return;
    const host = document.getElementById('public-tt-body');
    // Keep the last good data on screen; offer a manual retry for transient
    // failures (cold starts after ~15 idle minutes can exceed timeouts).
    if (host && !host.querySelector('.live-retry')) {
      host.insertAdjacentHTML('afterbegin',
        `<div class="alert alert-warn live-retry">Live update failed — showing last known schedule.
         <a class="forgot-link" style="display:inline;margin:0 0 0 6px" onclick="refreshPublicTimetable()">Retry</a></div>`);
    }
  }
}

function startPublicTimetableRefresh() {
  // Defensive clear (render() already stopped us); no gen bump here — data
  // was just set by the caller and there is no in-flight fetch to invalidate.
  if (publicTTTimer) { clearInterval(publicTTTimer); publicTTTimer = null; }
  publicTTTimer = setInterval(refreshPublicTimetable, PUBLIC_TT_REFRESH_MS);
  // Browsers throttle timers in background tabs; refresh immediately when the
  // hostel-gate tab becomes visible again so data is never minutes stale.
  if (!publicTTVisibilityHooked) {
    publicTTVisibilityHooked = true;
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && publicTTTimer) refreshPublicTimetable();
    });
  }
}

// Today / Full-week toggle repaints in place — no refetch, no flash.
function switchPublicTimetableMode(mode) {
  if (!document.getElementById('public-tt-body')) return showPublicTimetable(mode);
  publicTTMode = mode;
  paintPublicTimetableBody();
}

  publicTTMode = mode;
  publicTTData = rows;
  render(`<a class="back-link" onclick="showLogin()">← Back to Login</a>
    <div class="card">

    schedule = results[1].schedule;
  } catch (e) {
    return render(backLink(back) + `<div class="card"><div class="alert alert-error">${e.message}</div></div>`);
  }
  let html = backLink(back) + `
    <div class="card">
      <h2><span class="icon">➕</span> Add Departure</h2>
      <div id="alert"></div>`;
  const vanBusNumbers = new Set(schedule.filter(s => s.vehicle_type === 'van' || /van/i.test(s.label || '')).map(s => s.bus_number));
  if (!buses.length) {
    html += `<div class="alert alert-warn">Register a bus first — timetable entries attach to buses.</div>`;
  } else {
    html += `
      <label>Vehicle</label>
      <select id="tt_bus">
        ${buses.map(b => `<option value="${b.bus_number}">${b.vehicle_type === 'van' ? '🚐 Van' : (vanBusNumbers.has(b.bus_number) ? '🚐 Van' : '🚌 Bus')} #${b.bus_number} — ${b.route}</option>`).join('')}
      </select>
      <label>Departure Time</label>
      <input type="time" id="tt_time">
      <label>Label (optional)</label>
      <input type="text" id="tt_label" placeholder="e.g. Morning shuttle · Mon-Sat">
      <button class="btn btn-primary" onclick="addScheduleEntry()">Add Departure</button>`;
  }
  html += `</div>
    <div class="card">
      <h2><span class="icon">🕒</span> Scheduled Departures (${schedule.length})</h2>`;
  if (!schedule.length) {
    html += `<div class="empty-state"><div class="icon">🕒</div><p>Nothing scheduled yet.</p></div>`;
  }
  schedule.forEach(s => {
    const isVan = s.vehicle_type === 'van' || /van/i.test(s.label || '');
    html += `
      <div class="list-item">
        <div class="row">
          <span style="font-weight:700">🕒 ${to12h(s.departure_time)} <span class="text-muted">(${s.departure_time})</span></span>
          <button class="btn btn-danger btn-sm" onclick="deleteScheduleEntry(${s.schedule_id})">🗑 Remove</button>
        </div>
        <div class="value">${isVan ? '🚐 Van' : '🚌 Bus'} #${s.bus_number} · ${s.route}</div>
        ${s.label ? `<div class="text-muted">${s.label}</div>` : ''}
      </div>`;
  });
  html += '</div>';
  render(html);
}

async function addScheduleEntry() {
  const bus_number = parseInt(document.getElementById('tt_bus').value);
  const departure_time = document.getElementById('tt_time').value;
  const label = document.getElementById('tt_label').value.trim();
  if (!departure_time) return showAlert('alert', 'Please pick a departure time.', 'error');
  try {
    await apiCall('POST', '/api/timetable', { bus_number, departure_time, label: label || undefined }, true);
    showTimetableEditor();
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

async function deleteScheduleEntry(id) {
  try {
    await apiCall('DELETE', '/api/timetable/' + id, undefined, true);
    showTimetableEditor();
  } catch (e) {
    alert(e.message);
  }
}

async function completeRide(id) {
  try {
    await apiCall('POST', `/api/requests/${id}/complete`, {}, true);
    showRequestList('APPROVED', '✅ Approved Requests');
  } catch (e) {
    alert(e.message);
  }
}

// ---------- ADMIN PORTAL ----------
function showAdminPortal() {
  render(`
    <div class="welcome-bar">
      <span>🛠️ <strong>Admin Portal</strong></span>
    </div>
    <div class="card">
      <h2><span class="icon">⚙️</span> Admin Dashboard</h2>
      <div class="menu-grid">
        <div class="menu-btn" onclick="showStaffManagement()"><span class="menu-icon">🔑</span>Staff Accounts</div>
        <div class="menu-btn" onclick="showStudentAccounts()"><span class="menu-icon">🎓</span>Students &amp; Passwords</div>
        <div class="menu-btn" onclick="showTimetableEditor('showAdminPortal')"><span class="menu-icon">🕒</span>Edit Timetable</div>
        <div class="menu-btn" onclick="showBusSchedule('showAdminPortal')"><span class="menu-icon">📊</span>Bus Schedule</div>
        <div class="menu-btn" onclick="doAutoAssign('showAdminPortal')"><span class="menu-icon">🔄</span>Auto-Assign</div>
        <div class="menu-btn" onclick="showRouteCapacity('showAdminPortal')"><span class="menu-icon">🗺️</span>Route Capacity</div>
        <div class="menu-btn" onclick="showRequestList('APPROVED','✅ Approved Requests','showAdminPortal')"><span class="menu-icon">✅</span>Approved Requests</div>
      </div>
      <hr class="divider">
      <button class="btn btn-outline btn-sm" onclick="doLogout()" style="width:100%">🚪 Logout</button>
    </div>
  `);
}

async function showStaffManagement() {
  render(backLink('showAdminPortal') + `<div class="card"><h2><span class="icon">🔑</span> Staff Accounts</h2><div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div></div>`);
  let staff;
  try {
    staff = (await apiCall('GET', '/api/admin/staff', undefined, true)).staff;
  } catch (e) {
    return render(backLink('showAdminPortal') + `<div class="card"><div class="alert alert-error">${e.message}</div></div>`);
  }
  let html = backLink('showAdminPortal') + `
    <div class="card">
      <h2><span class="icon">🔑</span> Staff Accounts</h2>`;
  staff.forEach(s => {
    html += `
      <div class="list-item">
        <div class="row">
          <span class="value" style="text-transform:capitalize">${s.role}</span>
          <span class="badge ${s.password_state === 'hashed' ? 'badge-approved' : 'badge-rejected'}">${s.password_state}</span>
        </div>
      </div>`;
  });
  html += `
      <hr class="divider">
      <h2><span class="icon">🔒</span> Change Staff Password</h2>
      <div id="alert"></div>
      <label>Staff Role</label>
      <select id="staff_role">
        ${staff.map(s => `<option value="${s.role}">${s.role}</option>`).join('')}
      </select>
      <div class="password-wrap">
        <label>New Password</label>
        <input type="password" id="staff_pass" placeholder="Min 8 characters">
      </div>
      <button class="btn btn-primary" onclick="changeStaffPassword()">Update Password</button>
    </div>`;
  render(html);
}

async function changeStaffPassword() {
  const role = document.getElementById('staff_role').value;
  const pass = document.getElementById('staff_pass').value;
  if (pass.length < 8) return showAlert('alert', 'Password must be at least 8 characters.', 'error');
  try {
    await apiCall('POST', '/api/admin/staff-password', { role, new_password: pass }, true);
    showAlert('alert', `Password for ${role} updated successfully.`, 'success');
    document.getElementById('staff_pass').value = '';
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

// ---------- ADMIN: STUDENT ACCOUNTS ----------
// Mass import + password resets — the only way students get or regain access.
async function showStudentAccounts() {
  render(backLink('showAdminPortal') + `<div class="card"><h2><span class="icon">🎓</span>Students &amp; Passwords</h2><div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div></div>`);
  let data;
  try {
    data = await apiCall('GET', '/api/admin/students?limit=200', undefined, true);
  } catch (e) {
    return render(backLink('showAdminPortal') + `<div class="card"><div class="alert alert-error">${e.message}</div></div>`);
  }
  render(backLink('showAdminPortal') + `
    <div class="card">
      <h2><span class="icon">🎓</span>Students &amp; Passwords</h2>
      <p style="margin:4px 0 0">${data.total} total · <strong>${data.on_default_password}</strong> still on a default password</p>
      <input type="search" id="stu_q" placeholder="Search roll number or name…" oninput="filterStudentRows(this.value)" style="margin-top:8px">
    </div>
    <div class="card">
      <h2><span class="icon">📤</span>Bulk Import Students</h2>
      <p style="margin:4px 0 8px">One student per line: <strong>roll number, name</strong> — room, hostel, phone optional. Existing roll numbers are skipped, never overwritten.</p>
      <textarea id="import_list" rows="5" placeholder="261030195, Aarav Sharma, 214, Peach Tree, 9876543210\n261030196, Diya Verma"></textarea>
      <div class="password-wrap" style="margin-top:8px">
        <label>Default password (each student must change it at first login)</label>
        <input type="text" id="import_pass" placeholder="Min 8 characters — blank = Pass@&lt;year&gt;">
      </div>
      <button class="btn btn-primary" onclick="doBulkImport()">Import Students</button>
      <div id="import_result"></div>
    </div>
    <div class="card">
      <h2><span class="icon">🔍</span>Student List</h2>
      <div id="stu_rows"></div>
    </div>`);
  renderStudentRows(data.students);
}

function renderStudentRows(students) {
  const el = document.getElementById('stu_rows');
  if (!students.length) { el.innerHTML = '<div class="empty-state"><div class="icon">👥</div><p>No students yet — use Bulk Import above.</p></div>'; return; }
  el.innerHTML = students.map(s => `
    <div class="list-item student-row" data-name="${(s.name || '').toLowerCase()}" data-roll="${s.roll_number}">
      <div class="row">
        <span class="value"><strong>${s.roll_number}</strong> — ${s.name}</span>
        <span class="badge ${s.on_default_password ? 'badge-rejected' : 'badge-approved'}">${s.on_default_password ? 'default password' : 'active'}</span>
      </div>
      <div class="row" style="margin-top:2px">
        <span class="label">${s.hostel || ''}${s.room ? ' · Room ' + s.room : ''}</span>
        <button class="btn btn-outline btn-sm" onclick="doResetStudentPassword(${s.roll_number}, '${(s.name || '').replace(/'/g, "\\'")}')">🔑 Reset password</button>
      </div>
    </div>`).join('');
}

function filterStudentRows(q) {
  q = (q || '').trim().toLowerCase();
  document.querySelectorAll('.student-row').forEach(el => {
    const hit = !q || el.dataset.roll.includes(q) || el.dataset.name.includes(q);
    el.style.display = hit ? '' : 'none';
  });
}

async function doBulkImport() {
  const raw = document.getElementById('import_list').value.trim();
  const pass = document.getElementById('import_pass').value;
  if (!raw) return showAlert('import_result', 'Paste at least one student line.', 'error');
  const students = raw.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split(',').map(p => p.trim());
    return { roll_number: parts[0], name: parts[1] || '', room: parts[2] || '', hostel: parts[3] || '', phone: parts[4] || '' };
  });
  for (const s of students) {
    if (!/^\d+$/.test(String(s.roll_number))) return showAlert('import_result', `Roll number must be numeric: "${s.roll_number}"`, 'error');
    if (!s.name) return showAlert('import_result', `Missing name for roll number ${s.roll_number}`, 'error');
  }
  try {
    const res = await apiCall('POST', '/api/admin/students', { students, default_password: pass || undefined }, true);
    document.getElementById('import_result').innerHTML =
      `<div class="alert alert-success">✅ Imported ${res.imported} student(s)${res.skipped_existing ? ` · skipped ${res.skipped_existing} already existing` : ''}. Share the default password in person — each student must change it at first login.</div>`;
    document.getElementById('import_list').value = '';
  } catch (e) {
    showAlert('import_result', e.message, 'error');
  }
}

async function doResetStudentPassword(roll, name) {
  const pass = prompt(`Reset password for ${name || roll}.\nEnter a new password (min 8 chars) — or leave blank to set the default. The student must change it at next login.`);
  if (pass === null) return;
  if (pass && pass.length < 8) return alert('Password must be at least 8 characters.');
  try {
    await apiCall('POST', `/api/admin/students/${roll}/password`, { new_password: pass || undefined }, true);
    alert(`Password reset for ${name || roll}. Share it in person — they must change it at next login.`);
    showStudentAccounts();
  } catch (e) {
    alert('Reset failed: ' + e.message);
  }
}

// ---------- LOGOUT ----------
function doLogout() {
  clearSession();
  showLogin();
}

// ---------- INIT ----------
// If a saved session exists, verify it is still valid before restoring.
if (session) {
  apiCall('GET', '/api/requests/mine', undefined, true)
    .then(() => { if (session.role === 'student') showStudentPortal(); else showLogin(); })
    .catch(() => {
      // Token may still be valid for non-student roles (mine is student-only).
      apiCall('GET', '/api/requests', undefined, true)
        .then(() => { if (session.role === 'guard') showGuardPortal(); else if (session.role === 'admin') showAdminPortal(); else showBusSchedulerPortal(); })
        .catch(() => {
          if (session.role === 'student' && session.must_change) return showForceChangePassword();
          clearSession(); showLogin();
        });
    });
} else {
  showLogin();
}
</script>
