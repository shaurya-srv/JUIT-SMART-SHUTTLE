<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUIT Smart Shuttle</title>
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --accent: #34a853;
    --danger: #ea4335;
    --warn: #fbbc04;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #202124;
    --text-light: #5f6368;
    --border: #dadce0;
    --radius: 10px;
    --shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app-header {
    background: linear-gradient(135deg, var(--primary), #0d47a1);
    color: #fff;
    width: 100%;
    padding: 18px 24px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  .app-header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .5px; }
  .app-header p { font-size: .85rem; opacity: .85; margin-top: 2px; }
  .container {
    width: 100%;
    max-width: 520px;
    padding: 24px 16px;
    flex: 1;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1.15rem;
    margin-bottom: 18px;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .icon { font-size: 1.3rem; }
  .welcome-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 10px 14px;
    background: #e8f0fe;
    border-radius: 8px;
    font-size: .85rem;
  }
  .welcome-bar strong { color: var(--primary-dark); }
  label {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    color: var(--text-light);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: .95rem;
    transition: border-color .2s;
    background: #fafafa;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,115,232,.15);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    width: 100%;
    margin-top: 16px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--accent); color: #fff; }
  .btn-success:hover { background: #2d9249; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #d32f2f; }
  .btn-outline {
    background: transparent;
    color: var(--primary);
    border: 1.5px solid var(--primary);
  }
  .btn-outline:hover { background: #e8f0fe; }
  .btn-sm { padding: 7px 14px; font-size: .8rem; width: auto; margin-top: 8px; }
  .btn-group { display: flex; gap: 8px; margin-top: 16px; }
  .btn-group .btn { flex: 1; }
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .menu-btn {
    padding: 18px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    cursor: pointer;
    text-align: center;
    transition: all .2s;
    font-size: .85rem;
    font-weight: 600;
    color: var(--text);
  }
  .menu-btn:hover {
    border-color: var(--primary);
    background: #e8f0fe;
    color: var(--primary);
  }
  .menu-btn .menu-icon { font-size: 1.6rem; display: block; margin-bottom: 6px; }
  .menu-btn.danger-zone { border-color: var(--danger); color: var(--danger); }
  .menu-btn.danger-zone:hover { background: #fce8e6; }
  .alert {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: .85rem;
    margin-bottom: 12px;
  }
  .alert-success { background: #e6f4ea; color: #137333; }
  .alert-error { background: #fce8e6; color: #c5221f; }
  .alert-info { background: #e8f0fe; color: #1967d2; }
  .alert-warn { background: #fef7e0; color: #b06000; }
  .list-item {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: .85rem;
    transition: all .2s;
  }
  .list-item:hover { border-color: var(--primary); }
  .list-item .label { color: var(--text-light); font-size: .75rem; }
  .list-item .value { font-weight: 600; margin-top: 2px; }
  .list-item .row { display: flex; justify-content: space-between; align-items: center; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-pending { background: #fef7e0; color: #b06000; }
  .badge-approved { background: #e6f4ea; color: #137333; }
  .badge-rejected { background: #fce8e6; color: #c5221f; }
  .badge-full { background: var(--danger); color: #fff; }
  .badge-warn { background: var(--warn); color: #333; }
  .capacity-bar {
    height: 8px;
    background: #e0e0e0;
    border-radius: 4px;
    overflow: hidden;
    margin: 6px 0;
  }
  .capacity-fill {
    height: 100%;
    border-radius: 4px;
    transition: width .3s;
  }
  .hidden { display: none !important; }
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }
  .text-center { text-align: center; }
  .text-muted { color: var(--text-light); font-size: .8rem; }
  .password-wrap {
    position: relative;
  }
  .password-wrap input { padding-right: 40px; }
  .password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--text-light);
  }
  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    color: var(--primary);
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
  .forgot-link {
    display: block;
    text-align: center;
    margin: 10px 0 0;
    color: var(--primary);
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .forgot-link:hover { text-decoration: underline; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .82rem;
    margin-top: 10px;
  }
  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--text-light); font-weight: 600; font-size: .75rem; text-transform: uppercase; }
  .empty-state {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-light);
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }
  .footer {
    text-align: center;
    padding: 16px;
    font-size: .75rem;
    color: var(--text-light);
  }
</style>
</head>
<body>

<div class="app-header">
  <h1>🚌 JUIT Smart Shuttle</h1>
  <p>Shuttle Request & Management System</p>
</div>

<div class="container" id="app"></div>
<div class="footer">JUIT Smart Shuttle &copy; 2026</div>

<script>
// ============================================================
// API CLIENT
// On Vercel: API is served from the same origin (relative paths).
// Locally: API runs on shuttle_api at 127.0.0.1:8080.
// ============================================================
const API = window.location.port === '8080'
  ? 'http://127.0.0.1:8080'           // running against local C server
  : window.location.origin;            // deployed (Vercel or same-origin)

// Wraps fetch with timeout + JSON handling; throws Error(message) on
// non-2xx using the API's {"error":"..."} body.
async function apiCall(method, path, body, auth = false) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch(API + path, {
      method,
      headers: {
        'Content-Type': 'application/json',
        ...(auth && window.API_TOKEN ? { 'Authorization': 'Bearer ' + window.API_TOKEN } : {})
      },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: ctrl.signal
    });
    const text = await res.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch { data = {}; }
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Request timed out. Is shuttle_api.exe running?');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

const LOCATIONS = ['JUIT', 'Ravli PG', 'Peach Tree', 'Waknaghat'];
const locName = (i) => LOCATIONS[i] || 'Unknown';
const locIndex = (s) => LOCATIONS.indexOf(s);
const routeName = (p, d) => `${p} → ${d}`;

// Session survives reload via localStorage (token only — server holds the state).
let session = JSON.parse(localStorage.getItem('jss_session') || 'null');
function saveSession() { localStorage.setItem('jss_session', JSON.stringify(session)); window.API_TOKEN = session ? session.token : null; }
function clearSession() { localStorage.removeItem('jss_session'); session = null; window.API_TOKEN = null; }
window.API_TOKEN = session ? session.token : null;

const badge = (status) =>
  `<span class="badge badge-${status === 'APPROVED' ? 'approved' : status === 'REJECTED' ? 'rejected' : 'pending'}">${status.replace('_',' ')}</span>`;

// ============================================================
// RENDERING
// ============================================================
const $app = document.getElementById('app');

function render(html) { $app.innerHTML = html; }

// ---------- LOGIN PAGE ----------
function showLogin() {
  render(`
    <div class="card">
      <h2><span class="icon">🔐</span> Login</h2>
      <div id="alert"></div>
      <label>Role</label>
      <select id="role">
        <option value="student">Student</option>
        <option value="guard">Guard</option>
        <option value="scheduler">Bus Scheduler</option>
      </select>
      <div id="rollField">
        <label>Roll Number</label>
        <input type="number" id="roll" placeholder="Enter roll number">
      </div>
      <div class="password-wrap">
        <label>Password</label>
        <input type="password" id="pass" placeholder="Enter password">
        <button class="password-toggle" onclick="togglePass()">👁</button>
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Login</button>
      <a class="forgot-link" onclick="showResetPassword()">🔑 Forgot Password?</a>
      <hr class="divider">
      <button class="btn btn-outline" onclick="showRegister()">📝 Register New Student</button>
    </div>
  `);
  document.getElementById('role').addEventListener('change', e => {
    document.getElementById('rollField').classList.toggle('hidden', e.target.value !== 'student');
  });
}

function togglePass() {
  const p = document.getElementById('pass');
  p.type = p.type === 'password' ? 'text' : 'password';
}

async function doLogin() {
  const role = document.getElementById('role').value;
  const pass = document.getElementById('pass').value;
  if (!pass) return showAlert('alert', 'Please enter a password.', 'error');

  const payload = { role, password: pass };
  if (role === 'student') {
    const roll = parseInt(document.getElementById('roll').value);
    if (!roll) return showAlert('alert', 'Please enter your roll number.', 'error');
    payload.roll_number = roll;
  }

  try {
    const data = await apiCall('POST', '/api/login', payload);
    session = data.role === 'student'
      ? { role: 'student', token: data.token, roll: data.roll_number, name: data.name }
      : { role: data.role, token: data.token };
    saveSession();
    if (session.role === 'student') showStudentPortal();
    else if (session.role === 'guard') showGuardPortal();
    else showBusSchedulerPortal();
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

function showAlert(id, msg, type) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

// ---------- RESET PASSWORD ----------
function showResetPassword() {
  render(`
    <a class="back-link" onclick="showLogin()">← Back to Login</a>
    <div class="card">
      <h2><span class="icon">🔑</span> Reset Password</h2>
      <div id="alert"></div>
      <label>Roll Number</label>
      <input type="number" id="reset_roll" placeholder="Enter your roll number">
      <label>New Password</label>
      <div class="password-wrap">
        <input type="password" id="reset_pass" placeholder="Enter new password">
        <button class="password-toggle" onclick="toggleResetPass()">👁</button>
      </div>
      <label>Confirm Password</label>
      <input type="password" id="reset_pass2" placeholder="Confirm new password">
      <button class="btn btn-primary" onclick="doResetPassword()">Reset Password</button>
    </div>
  `);
}

function toggleResetPass() {
  const p = document.getElementById('reset_pass');
  p.type = p.type === 'password' ? 'text' : 'password';
}

async function doResetPassword() {
  const roll = parseInt(document.getElementById('reset_roll').value);
  const pass = document.getElementById('reset_pass').value;
  const pass2 = document.getElementById('reset_pass2').value;
  if (!roll) return showAlert('alert', 'Please enter your roll number.', 'error');
  if (!pass) return showAlert('alert', 'Please enter a new password.', 'error');
  if (pass.length < 4) return showAlert('alert', 'Password must be at least 4 characters.', 'error');
  if (pass !== pass2) return showAlert('alert', 'Passwords do not match.', 'error');

  try {
    await apiCall('POST', '/api/reset-password', { roll_number: roll, new_password: pass });
    showAlert('alert', 'Password reset successful! You can now login.', 'success');
    setTimeout(showLogin, 1500);
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

// ---------- REGISTER ----------
function showRegister() {
  render(`
    <a class="back-link" onclick="showLogin()">← Back to Login</a>
    <div class="card">
      <h2><span class="icon">📝</span> Student Registration</h2>
      <div id="alert"></div>
      <label>Roll Number</label>
      <input type="number" id="reg_roll" placeholder="e.g. 261030195">
      <label>Name</label>
      <input type="text" id="reg_name" placeholder="Full name">
      <label>Room Number</label>
      <input type="text" id="reg_room" placeholder="e.g. 26">
      <label>Hostel</label>
      <select id="reg_hostel">
        <option>Peach Tree</option>
        <option>Ravli PG</option>
        <option>Geeta Bhavan</option>
        <option>Waknaghat</option>
      </select>
      <label>Phone Number</label>
      <input type="tel" id="reg_phone" placeholder="10-digit number">
      <div class="password-wrap">
        <label>Create Password</label>
        <input type="password" id="reg_pass" placeholder="Min 4 characters">
      </div>
      <button class="btn btn-success" onclick="doRegister()">Register</button>
    </div>
  `);
}

async function doRegister() {
  const roll = parseInt(document.getElementById('reg_roll').value);
  const name = document.getElementById('reg_name').value.trim();
  const room = document.getElementById('reg_room').value.trim();
  const hostel = document.getElementById('reg_hostel').value;
  const phone = document.getElementById('reg_phone').value.trim();
  const pass = document.getElementById('reg_pass').value;

  if (!roll || !name || !room || !phone || !pass)
    return showAlert('alert', 'All fields are required.', 'error');
  if (pass.length < 4)
    return showAlert('alert', 'Password must be at least 4 characters.', 'error');

  try {
    await apiCall('POST', '/api/register', {
      roll_number: roll, name, room, hostel, phone, password: pass
    });
    showAlert('alert', 'Registration successful! You can now login.', 'success');
    setTimeout(showLogin, 1500);
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

// ---------- STUDENT PORTAL ----------
function showStudentPortal() {
  render(`
    <div class="welcome-bar">
      <span>Welcome, <strong>${session.name}</strong></span>
      <span class="text-muted">Roll: ${session.roll}</span>
    </div>
    <div class="card">
      <h2><span class="icon">🎓</span> Student Portal</h2>
      <div class="menu-grid">
        <div class="menu-btn" onclick="showCreateRequest()"><span class="menu-icon">🚗</span>Create Pickup Request</div>
        <div class="menu-btn" onclick="showStudentStatus()"><span class="menu-icon">📋</span>Check Request Status</div>
      </div>
      <hr class="divider">
      <button class="btn btn-outline btn-sm" onclick="doLogout()" style="width:100%">🚪 Logout</button>
    </div>
  `);
}

function showCreateRequest() {
  render(`
    <a class="back-link" onclick="showStudentPortal()">← Back</a>
    <div class="card">
      <h2><span class="icon">🚗</span> Create Pickup Request</h2>
      <div id="alert"></div>
      <label>Pickup Location</label>
      <select id="req_pickup">
        ${LOCATIONS.map((l,i) => `<option value="${i}">${l}</option>`).join('')}
      </select>
      <label>Dropoff Location</label>
      <select id="req_dropoff">
        ${LOCATIONS.map((l,i) => `<option value="${i}" ${i===1?'selected':''}>${l}</option>`).join('')}
      </select>
      <button class="btn btn-primary" onclick="submitRequest()">Submit Request</button>
    </div>
  `);
}

async function submitRequest() {
  const pickup = locName(parseInt(document.getElementById('req_pickup').value));
  const dropoff = locName(parseInt(document.getElementById('req_dropoff').value));
  if (pickup === dropoff) return showAlert('alert', 'Pickup and dropoff must be different.', 'error');

  try {
    const data = await apiCall('POST', '/api/requests', { pickup_place: pickup, dropoff_place: dropoff }, true);
    showAlert('alert', `Request #${data.request_number} submitted successfully!`, 'success');
    setTimeout(showStudentPortal, 1200);
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

async function showStudentStatus() {
  render(`<a class="back-link" onclick="showStudentPortal()">← Back</a><div class="card"><h2><span class="icon">📋</span> My Requests</h2><div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div></div>`);
  let rows;
  try {
    rows = (await apiCall('GET', '/api/requests/mine', undefined, true)).requests;
  } catch (e) {
    return render(`<a class="back-link" onclick="showStudentPortal()">← Back</a><div class="card"><div class="alert alert-error">${e.message}</div></div>`);
  }
  let html = `
    <a class="back-link" onclick="showStudentPortal()">← Back</a>
    <div class="card">
      <h2><span class="icon">📋</span> My Requests</h2>
  `;
  if (!rows.length) {
    html += `<div class="empty-state"><div class="icon">📭</div><p>No requests yet.</p></div>`;
  } else {
    rows.forEach(r => {
      const busLabel = r.bus ? `Bus #${r.bus}` : 'Not assigned';
      html += `
        <div class="list-item">
          <div class="row">
            <span class="label">Request #${r.request_number}</span>
            ${badge(r.status)}
          </div>
          <div class="value">${r.pickup} → ${r.dropoff}</div>
          <div class="text-muted" style="margin-top:4px">🚌 ${busLabel}</div>
        </div>`;
    });
  }
  html += '</div>';
  render(html);
}

// ---------- GUARD PORTAL ----------
async function showGuardPortal() {
  let pendingCount = '?';
  try {
    pendingCount = (await apiCall('GET', '/api/requests?status=PENDING_APPROVAL', undefined, true)).count;
  } catch (e) { /* show dashboards regardless */ }
  render(`
    <div class="welcome-bar">
      <span>🧑‍✈️ <strong>Guard Portal</strong></span>
      <span class="badge badge-pending">${pendingCount} pending</span>
    </div>
    <div class="card">
      <h2><span class="icon">🛡️</span> Guard Dashboard</h2>
      <div class="menu-grid">
        <div class="menu-btn" onclick="showPendingRequests()"><span class="menu-icon">📥</span>Process Requests <br><small class="text-muted">${pendingCount} pending</small></div>
        <div class="menu-btn" onclick="showApprovedList()"><span class="menu-icon">✅</span>Approved</div>
        <div class="menu-btn" onclick="showRejectedList()"><span class="menu-icon">❌</span>Rejected</div>
      </div>
      <hr class="divider">
      <button class="btn btn-outline btn-sm" onclick="doLogout()" style="width:100%">🚪 Logout</button>
    </div>
  `);
}

async function showPendingRequests() {
  render(`<a class="back-link" onclick="showGuardPortal()">← Back</a><div class="card"><h2><span class="icon">📥</span> Pending Requests</h2><div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div></div>`);
  let rows;
  try {
    rows = (await apiCall('GET', '/api/requests?status=PENDING_APPROVAL', undefined, true)).requests;
  } catch (e) {
    return render(`<a class="back-link" onclick="showGuardPortal()">← Back</a><div class="card"><div class="alert alert-error">${e.message}</div></div>`);
  }
  let html = `
    <a class="back-link" onclick="showGuardPortal()">← Back</a>
    <div class="card">
      <h2><span class="icon">📥</span> Pending Requests (${rows.length})</h2>
  `;
  if (!rows.length) {
    html += `<div class="empty-state"><div class="icon">✅</div><p>No pending requests.</p></div>`;
  }
  rows.forEach(r => {
    html += `
      <div class="list-item">
        <div class="row">
          <span class="label">Request #${r.request_number}</span>
          <span class="badge badge-pending">PENDING</span>
        </div>
        <div class="value">${r.student_name} (Roll: ${r.roll_number})</div>
        <div class="text-muted">${r.hostel} · Room ${r.room} · ${r.phone}</div>
        <div style="margin-top:6px;font-weight:600">${r.pickup} → ${r.dropoff}</div>
        <div class="btn-group">
          <button class="btn btn-success btn-sm" onclick="decideRequest(${r.request_number},'approve')">✅ Approve</button>
          <button class="btn btn-danger btn-sm" onclick="decideRequest(${r.request_number},'reject')">❌ Reject</button>
        </div>
      </div>`;
  });
  html += '</div>';
  render(html);
}

async function decideRequest(id, action) {
  try {
    const data = await apiCall('POST', `/api/requests/${id}/${action}`, {}, true);
    showPendingRequests();
  } catch (e) {
    alert(e.message);
    showPendingRequests();
  }
}

function showApprovedList() { showRequestList('APPROVED', '✅ Approved Requests'); }
function showRejectedList() { showRequestList('REJECTED', '❌ Rejected Requests'); }

async function showRequestList(status, title) {
  render(`<a class="back-link" onclick="showGuardPortal()">← Back</a><div class="card"><h2>${title}</h2><div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div></div>`);
  let rows;
  try {
    rows = (await apiCall('GET', '/api/requests?status=' + status, undefined, true)).requests;
  } catch (e) {
    return render(`<a class="back-link" onclick="showGuardPortal()">← Back</a><div class="card"><div class="alert alert-error">${e.message}</div></div>`);
  }
  let html = `
    <a class="back-link" onclick="showGuardPortal()">← Back</a>
    <div class="card">
      <h2>${title} (${rows.length})</h2>
  `;
  if (!rows.length) {
    html += `<div class="empty-state"><div class="icon">📭</div><p>No ${status.toLowerCase()} requests.</p></div>`;
  }
  rows.forEach(r => {
    html += `
      <div class="list-item">
        <div class="row">
          <span class="label">Request #${r.request_number}</span>
          <span class="badge badge-${status === 'APPROVED' ? 'approved' : 'rejected'}">${status}</span>
        </div>
        <div class="value">${r.student_name} (Roll: ${r.roll_number})</div>
        <div>${r.pickup} → ${r.dropoff}</div>
        ${r.bus ? `<div class="text-muted">🚌 Bus #${r.bus}</div>` : ''}
      </div>`;
  });
  html += '</div>';
  render(html);
}

// ---------- BUS SCHEDULER PORTAL ----------
function showBusSchedulerPortal() {
  render(`
    <div class="welcome-bar">
      <span>🚌 <strong>Bus Scheduler Portal</strong></span>
    </div>
    <div class="card">
      <h2><span class="icon">🗓️</span> Bus Scheduler</h2>
      <div class="menu-grid">
        <div class="menu-btn" onclick="showRegisterBus()"><span class="menu-icon">➕</span>Register Bus</div>
        <div class="menu-btn" onclick="doAutoAssign()"><span class="menu-icon">🔄</span>Auto-Assign</div>
        <div class="menu-btn" onclick="showBusSchedule()"><span class="menu-icon">📊</span>Bus Schedule</div>
        <div class="menu-btn" onclick="showRouteCapacity()"><span class="menu-icon">🗺️</span>Route Capacity</div>
      </div>
      <hr class="divider">
      <button class="btn btn-outline btn-sm" onclick="doLogout()" style="width:100%">🚪 Logout</button>
    </div>
  `);
}

function showRegisterBus() {
  render(`
    <a class="back-link" onclick="showBusSchedulerPortal()">← Back</a>
    <div class="card">
      <h2><span class="icon">➕</span> Register New Bus</h2>
      <div id="alert"></div>
      <label>Route Pickup</label>
      <select id="bus_pickup">
        ${LOCATIONS.map((l,i) => `<option value="${i}">${l}</option>`).join('')}
      </select>
      <label>Route Dropoff</label>
      <select id="bus_dropoff">
        ${LOCATIONS.map((l,i) => `<option value="${i}" ${i===2?'selected':''}>${l}</option>`).join('')}
      </select>
      <label>Max Capacity</label>
      <input type="number" id="bus_cap" value="20" min="1" max="30">
      <button class="btn btn-primary" onclick="registerBus()">Register Bus</button>
    </div>
  `);
}

async function registerBus() {
  const pickup = parseInt(document.getElementById('bus_pickup').value);
  const dropoff = parseInt(document.getElementById('bus_dropoff').value);
  const cap = parseInt(document.getElementById('bus_cap').value);
  if (pickup === dropoff) return showAlert('alert', 'Pickup and dropoff must differ.', 'error');
  if (cap < 1 || cap > 30) return showAlert('alert', 'Capacity must be 1–30.', 'error');

  try {
    const data = await apiCall('POST', '/api/buses',
      { route_pickup: pickup, route_dropoff: dropoff, max_capacity: cap }, true);
    showAlert('alert', `Bus #${data.bus_number} registered: ${locName(pickup)} → ${locName(dropoff)} (cap: ${cap})`, 'success');
    setTimeout(showBusSchedulerPortal, 1200);
  } catch (e) {
    showAlert('alert', e.message, 'error');
  }
}

async function doAutoAssign() {
  try {
    const r = await apiCall('POST', '/api/buses/assign', {}, true);
    let msg = `${r.assigned} request(s) assigned.`;
    if (r.no_bus_available) msg += ` ${r.no_bus_available} could not be placed (no matching bus or all full).`;
    if (r.warned_buses && r.warned_buses.length) msg += ` ⚠️ Buses at 80%+ capacity: ${r.warned_buses.map(b => '#' + b).join(', ')}`;
    alert(msg);
    showBusSchedulerPortal();
  } catch (e) {
    alert(e.message);
  }
}

async function showBusSchedule() {
  render(`<a class="back-link" onclick="showBusSchedulerPortal()">← Back</a><div class="card"><h2><span class="icon">📊</span> Bus Schedule</h2><div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div></div>`);
  let buses;
  try {
    buses = (await apiCall('GET', '/api/buses', undefined, true)).buses;
  } catch (e) {
    return render(`<a class="back-link" onclick="showBusSchedulerPortal()">← Back</a><div class="card"><div class="alert alert-error">${e.message}</div></div>`);
  }
  let html = `
    <a class="back-link" onclick="showBusSchedulerPortal()">← Back</a>
    <div class="card">
      <h2><span class="icon">📊</span> Bus Schedule</h2>
  `;
  if (!buses.length) {
    html += `<div class="empty-state"><div class="icon">🚌</div><p>No buses registered.</p></div>`;
  }
  buses.forEach(bus => {
    const pct = bus.capacity ? Math.round((bus.assigned / bus.capacity) * 100) : 0;
    const color = pct >= 80 ? 'var(--danger)' : pct >= 50 ? 'var(--warn)' : 'var(--accent)';

    html += `
      <div class="list-item">
        <div class="row">
          <span style="font-weight:700">🚌 Bus #${bus.bus_number}</span>
          ${pct >= 100 ? '<span class="badge badge-full">FULL</span>' : pct >= 80 ? '<span class="badge badge-warn">80%+</span>' : ''}
        </div>
        <div class="value">${bus.route}</div>
        <div class="capacity-bar"><div class="capacity-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="text-muted">${bus.assigned} / ${bus.capacity} seats (${bus.capacity - bus.assigned} available)</div>
      </div>`;
  });
  html += '</div>';
  render(html);
}

async function showRouteCapacity() {
  render(`<a class="back-link" onclick="showBusSchedulerPortal()">← Back</a><div class="card"><h2><span class="icon">🗺️</span> Route Capacity</h2><div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div></div>`);
  let routes;
  try {
    routes = (await apiCall('GET', '/api/reports/capacity', undefined, true)).routes;
  } catch (e) {
    return render(`<a class="back-link" onclick="showBusSchedulerPortal()">← Back</a><div class="card"><div class="alert alert-error">${e.message}</div></div>`);
  }
  let html = `
    <a class="back-link" onclick="showBusSchedulerPortal()">← Back</a>
    <div class="card">
      <h2><span class="icon">🗺️</span> Route Capacity</h2>
  `;
  if (!routes.length) {
    html += `<div class="empty-state"><div class="icon">🗺️</div><p>No buses registered.</p></div>`;
  } else {
    html += '<table><tr><th>Route</th><th>Buses</th><th>Assigned</th><th>Capacity</th><th>Available</th></tr>';
    routes.forEach(r => {
      html += `<tr>
        <td style="font-weight:600">${r.route}</td>
        <td>${r.buses}</td>
        <td>${r.assigned}</td>
        <td>${r.capacity}</td>
        <td style="color:${r.available === 0 ? 'var(--danger)' : 'var(--accent)'};font-weight:600">${r.available}</td>
      </tr>`;
    });
    html += '</table>';
  }
  html += '</div>';
  render(html);
}

// ---------- LOGOUT ----------
function doLogout() {
  clearSession();
  showLogin();
}

// ---------- INIT ----------
// If a saved session exists, verify it is still valid before restoring.
if (session) {
  apiCall('GET', '/api/requests/mine', undefined, true)
    .then(() => { if (session.role === 'student') showStudentPortal(); else showLogin(); })
    .catch(() => {
      // Token may still be valid for non-student roles (mine is student-only).
      apiCall('GET', '/api/requests', undefined, true)
        .then(() => { if (session.role === 'guard') showGuardPortal(); else showBusSchedulerPortal(); })
        .catch(() => { clearSession(); showLogin(); });
    });
} else {
  showLogin();
}
</script>
